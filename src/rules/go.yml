id: def-func
language: go
rule:
  kind: function_declaration
---
id: def-method
language: go
rule:
  kind: method_declaration
---
# `type A B` and `type A = B` are two node kinds in this grammar and one
# declaration in the language: both put `A` in the package block. Reading only
# `type_spec` cost nothing while Go emitted no type uses — nothing ever named
# an alias — and became 57 `NoMatchingDefinition` rows on the Go corpus the
# moment it did.
id: def-type
language: go
rule:
  any:
    - kind: type_spec
    - kind: type_alias
---
id: def-const
language: go
rule:
  kind: const_spec
---
id: def-var
language: go
rule:
  kind: var_spec
