id: ref-call
language: go
rule:
  kind: call_expression
---
# Every written type name. One kind is enough: the Go grammar routes every
# type position — parameter, result, receiver, struct field, embedded field,
# composite literal, conversion, assertion, type-switch case, alias right-hand
# side, generic argument and constraint — through `type_identifier`, and a
# qualified `pkg.T` writes its `name` half as one too. Which of those a
# particular node is, and whether it is a *declaration* rather than a use, is
# decided in Rust, where the ancestor chain is available.
#
# Kinds deliberately absent:
#   qualified_type - its `name` child is already a `type_identifier`; matching
#                    both would emit `pkg.T` twice.
#   package_identifier
#                  - the `pkg` half of `pkg.T`, read from the qualified node.
#   field_identifier
#                  - a struct field's *name*, which declares rather than names.
#   identifier     - a type parameter's own name in `[T any]`, and the `T` in
#                    `T(x)`, which the grammar already routes through
#                    `ref-call` as a conversion. Emitting them here would
#                    count one site twice.
#
# One shape reaches `type_identifier` in *callee* position and so is not a type
# use at all: `Generic[T](x)`. An explicit instantiation is unambiguously a
# type, so the grammar files the whole call as a `type_conversion_expression`
# and `ref-call` — which matches `call_expression` — never sees it. The site is
# reported as the `Call` it is; `instantiated_callee` in `extract_go.rs` is
# where, and it is still one row for one site.
id: ref-type
language: go
rule:
  kind: type_identifier
---
# Every selector that is *read* rather than called: `pkg.Name`, `t.field`,
# `x.y`, `T.Method`. `ref-call` already owns the selector standing in a call's
# callee position, so this rule matches the same node kind and `extract_go.rs`
# drops that one — one site, one row, whichever of the two saw it first.
#
# Only the *outermost* selector of a chain is a reference: `a.b.c` is one
# reference to `c` through `a.b`, and matching the inner `a.b` too would report
# a second reference to a member nobody named on its own. Which node that is
# needs the parent, so it is decided in Rust.
#
# A *type* written `pkg.T` is a `qualified_type` and not a selector, so in a
# type position this rule and `ref-type` cannot see the same site. In an
# *expression* position the grammar has no `qualified_type` to offer, so they
# can: `(*util.Thing)(nil)` writes a type and the parser hands it over as a
# `selector_expression`, and the row is a `field-access` naming the right node
# under the wrong kind. One occurrence on `codeiq`, none on `caddy`; the
# `field-access` occurrence census in `tests/corpus.rs` pins the count.
#
# Go writes a method value (`t.M` passed as a func) exactly as it writes a
# field read, and the grammar does not separate them, so both are
# `FieldAccess`. Java can split `MethodRef` out because `::` is its own syntax;
# here a split would be arthron guessing which of the two a name is.
id: ref-select
language: go
rule:
  kind: selector_expression
---
# A composite literal's keys: the `Field` in `T{Field: v}`.
#
# Only a *struct* literal's key names a member. A map literal's key is an
# expression that is evaluated (`map[K]V{k: v}`), and an array literal's is an
# index — neither names a field, and this track emits no reference for a bare
# identifier read, so neither becomes a row. The difference is the literal's
# stated type, which is on the `composite_literal` above the key and therefore
# read in Rust.
#
# The type may be stated one level out: `[]T{{Field: v}}` and
# `map[string]T{"k": {Field: v}}` write it on the container and elide it on the
# element. `extract_go.rs` follows that outwards; an *anonymous* struct type
# (`[]struct{ n int }{{n: 1}}`) has no canonical name, so it is not a node and
# neither are its fields — there is nothing for a key to name and no row is
# emitted.
#
# The type separating the two is the type *as written*, not as declared, and
# that is a known limit rather than the whole rule. `map[K]V{k: v}` is
# rejected because the site says `map`; `type Registry map[K]V` followed by
# `Registry{k: v}` is not, because the site says a name and the declaration is
# usually in another file of the package, which no file-local extractor reads.
# Such a key is reported as `Registry.k` — measured at 9 rows / 90 occurrences
# on `codeiq`, 0 on `caddy` — and lands in `NeedsReceiverType`, inside the
# denominator. `named_type_path` in `extract_go.rs` carries the measurement
# and why neither layer can close it alone; `GoResolver::resolve_field`
# carries the guarantee that it can never become a wrong *edge*.
id: ref-litkey
language: go
rule:
  kind: keyed_element
