id: package
language: go
rule:
  kind: package_clause
---
id: import
language: go
rule:
  kind: import_spec
---
id: def-func
language: go
rule:
  kind: function_declaration
---
id: def-method
language: go
rule:
  kind: method_declaration
---
# `type A B` and `type A = B` are two node kinds in this grammar and one
# declaration in the language: both put `A` in the package block. Reading only
# `type_spec` cost nothing while Go emitted no type uses — nothing ever named
# an alias — and became 57 `NoMatchingDefinition` rows on the Go corpus the
# moment it did.
id: def-type
language: go
rule:
  any:
    - kind: type_spec
    - kind: type_alias
---
id: def-const
language: go
rule:
  kind: const_spec
---
id: def-var
language: go
rule:
  kind: var_spec
---
id: ref-call
language: go
rule:
  kind: call_expression
---
# Every written type name. One kind is enough: the Go grammar routes every
# type position — parameter, result, receiver, struct field, embedded field,
# composite literal, conversion, assertion, type-switch case, alias right-hand
# side, generic argument and constraint — through `type_identifier`, and a
# qualified `pkg.T` writes its `name` half as one too. Which of those a
# particular node is, and whether it is a *declaration* rather than a use, is
# decided in Rust, where the ancestor chain is available.
#
# Kinds deliberately absent:
#   qualified_type - its `name` child is already a `type_identifier`; matching
#                    both would emit `pkg.T` twice.
#   package_identifier
#                  - the `pkg` half of `pkg.T`, read from the qualified node.
#   field_identifier
#                  - a struct field's *name*, which declares rather than names.
#   identifier     - a type parameter's own name in `[T any]`, and the `T` in
#                    `T(x)`, which the grammar already routes through
#                    `ref-call` as a conversion. Emitting them here would
#                    count one site twice.
id: ref-type
language: go
rule:
  kind: type_identifier
