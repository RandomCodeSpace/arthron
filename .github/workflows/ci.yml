name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Each leg's name is its branch-protection context, so the names are data
    # and not decoration. The Linux leg keeps the exact string it had before
    # this matrix existed — renaming it would silently drop the required check
    # on main, which is the same hazard gate.yml warns about for itself, and
    # `.github/workflows/automerge.yml` turns a dropped required check
    # straight into a merge. The two new legs are new contexts and have to be
    # added to branch protection deliberately; see automerge.yml for the list
    # that has to be required.
    name: ${{ matrix.context }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's failure must not hide another's. A cross-platform bug
      # usually shows up on exactly one runner, and cancelling the rest is
      # cancelling the evidence.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          # fmt and clippy are platform-independent — the same source, the same
          # toolchain, the same lints — so they run once rather than three
          # times. `cargo test` does not: the store, the file walk and every
          # path this engine builds are exactly where a platform difference
          # would show up.
          - os: ubuntu-latest
            lint: true
            context: "fmt, clippy, test"
          - os: macos-latest
            context: "fmt, clippy, test (macos-latest)"
          - os: windows-latest
            context: "fmt, clippy, test (windows-latest)"
    steps:
      - uses: actions/checkout@v5

      # Runners ship rustup on all three platforms, so no third-party toolchain
      # action is needed.
      - name: Pin toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      # ast-grep-language builds 27 tree-sitter grammars from C; without a
      # cache every run pays several minutes for dependencies that never change.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatting
        if: matrix.lint
        run: cargo fmt --all --check

      # -D on the clippy invocation, not RUSTFLAGS: a global RUSTFLAGS would
      # also deny warnings inside dependencies, which we do not control.
      - name: Clippy
        if: matrix.lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The corpus lives in the private RandomCodeSpace/arthron-corpus and is
      # not fetched here, so every corpus ratchet skips — by design, and on all
      # three platforms, which is why no deploy key is needed off Linux. What
      # runs here is everything else: the fixtures, the store, the resolver
      # units, the CLI and the JSON shapes. `.github/workflows/gate.yml` is the
      # job that fetches the corpus and makes the rates block a merge, and
      # `tests/baselines.rs` — which reads no corpus, so it runs here — is what
      # makes a baseline missing from that workflow fail.
      #
      # `tests/scan_errors.rs` is `#![cfg(unix)]`: its subject is `chmod 000`
      # and non-UTF-8 filenames, and `std::os::unix` does not exist on Windows,
      # so without the gate this step would not fail its assertions on the
      # Windows leg — it would fail to compile the test binary and never run
      # any test at all.
      - name: Tests
        run: cargo test --all-features

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads rust-version from Cargo.toml so the declared MSRV cannot drift
      # away from what the dependency tree actually requires.
      - name: Install declared MSRV toolchain
        run: |
          MSRV=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "Declared MSRV: $MSRV"
          rustup toolchain install "$MSRV" --profile minimal
          rustup default "$MSRV"
          rustc --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-msrv-

      - name: Build
        run: cargo check --all-targets --all-features

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The one third-party action in this repository, and it earns its place:
      # both tools ship prebuilt binaries, and `cargo install`ing them from
      # source costs several minutes of runner time on every push to answer a
      # question that takes seconds.
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      # Vulnerabilities, unsound APIs and yanked releases, against the live
      # RustSec database — a `cargo audit` failure here means a fresh advisory
      # landed against a dependency, not that this commit changed anything.
      # `unmaintained` is deliberately not denied on this step: it is a fact
      # about a crate's upkeep rather than its behaviour, and the reviewed
      # decision about each one lives in deny.toml where it can carry a reason.
      - name: cargo audit
        run: cargo audit --deny unsound --deny yanked

      # The policy check: licenses we may ship under, crates.io as the only
      # source, no wildcard version requirements, and the advisory list with
      # its documented exceptions. See deny.toml.
      - name: cargo deny
        run: cargo deny check
