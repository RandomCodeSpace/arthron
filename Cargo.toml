[package]
name = "arthron"
version = "0.0.2"
edition = "2024"
rust-version = "1.89"
description = "Local-first code intelligence. One resolver links cross-file references into a verified graph and records every reference it cannot link, with a reason, instead of dropping it."
repository = "https://github.com/RandomCodeSpace/arthron"
homepage = "https://github.com/RandomCodeSpace/arthron"
readme = "README.md"
license = "MIT"
# A keyword is read as a capability claim on the crate page, so "call-graph"
# is not one of them: tier 1 resolves calls, imports and type uses into a
# graph and says what it could not link, which is not a complete call graph.
keywords = ["code-intelligence", "code-graph", "static-analysis", "ast", "cross-reference"]
categories = ["development-tools", "command-line-utilities"]
# An allowlist, not a denylist: what a published crate carries is everything
# that compiles it and nothing else. `src/**/*` is deliberately broad because
# the extractors `include_str!` their rule files out of `src/rules/`, so a
# `*.rs`-only list would break the build after packaging rather than before.
# corpus/ (a symlink to a private repository), baselines/, tests/, docs/,
# npm/ and .github/ are all outside it — none of them is needed to build the
# crate, and the corpus is not ours to redistribute.
#
# Every pattern is anchored with a leading `/`. These are .gitignore patterns,
# so an unanchored `LICENSE` matches a file of that name at *any* depth: it
# pulled every `corpus/<lang>/<project>/LICENSE` into the tarball through the
# corpus symlink, and `README.md` pulled in `npm/README.md`. Anchoring is what
# makes this list mean the four files at the root that it reads as meaning.
include = [
    "/src/**",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Build release artifacts on a pull request or manual dispatch, but only a tag
# push may upload them or create a GitHub Release.
pr-run-mode = "upload"
# release.yml has the repository's tag and dispatch safety policy below; retain
# cargo-dist's generated build graph while preventing regeneration from erasing it.
allow-dirty = ["ci"]
# Where to host releases
hosting = "github"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# The installers to generate for each app
installers = []

[dependencies]
ast-grep-config = "=0.44.1"
ast-grep-core = "=0.44.1"
ast-grep-language = "=0.44.1"
bincode = "2"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
redb = "=4.1.0"
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[lints.rust]
missing_docs = "deny"

# The profile cargo-dist uses for release artifacts.
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
tempfile = "3"
