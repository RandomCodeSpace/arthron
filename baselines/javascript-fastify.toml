# arthron gate baseline — regenerate by running
#   cargo test --release --test ecma_corpus -- --nocapture
# and copying the counts it prints. `arthron gate` cannot be pointed at a
# JavaScript-only corpus yet: `pipeline::scan_repo` propagates the first live
# track's error and the Go track's phase 0 fails without a `go.mod`. The
# comparison in `tests/ecma_corpus.rs` runs the same `gate::evaluate`.
# Release build, cold store. Counts are measured, never estimated.
#
# `corpus` and `commit` are provenance: printed, never verified.
# The rate is not stored — it is derived from `resolved` and
# `unresolved` on both sides, so the comparison is exact integer
# arithmetic and cannot disagree with its own counts.
# `external` and `local_binding` sit outside both rate terms; any
# drift in either fails the gate and must be re-based deliberately.
#
# `local_binding` is very large here and that is correct, not a leak:
# fastify's suite is written as `t => { t.assert.ok(...) }`, so the receiver
# of most calls is the test callback's own parameter. A parameter is not a
# node by design, so those references are excluded from *both* terms of the
# rate rather than counted as failures.
format = 1
corpus = "corpus/javascript/fastify"
commit = "94bcbcc"
language = "javascript"
resolved = 2795
external = 4911
local_binding = 21542
unresolved = 1888
